    <!-- Botpress Webchat (Deferred to window load & idle to eliminate render-blocking) -->
    <script>
      (function() {
        var mobileCss = '@media (max-width: 768px) {' +
          '.bpFabWrapper { bottom: 16px !important; right: 16px !important; }' +
          '.bpFab { width: 52px !important; height: 52px !important; }' +
          '.bpWebchat { width: calc(100vw - 20px) !important; max-width: 380px !important; height: min(560px, calc(100dvh - 30px)) !important; max-height: calc(100dvh - 30px) !important; bottom: 12px !important; right: 10px !important; border-radius: 20px !important; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45) !important; }' +
          '.bpMessagePreview { width: calc(100vw - 32px) !important; max-width: 320px !important; right: 16px !important; bottom: 76px !important; }' +
          ':where(.bpReset) { --bpFontSize-scale: 0.9 !important; }' +
        '}';

        function injectShadowStyle(rootEl) {
          if (!rootEl || !rootEl.shadowRoot) return;
          if (rootEl.shadowRoot.getElementById('bp-mobile-style')) return;
          var style = document.createElement('style');
          style.id = 'bp-mobile-style';
          style.textContent = mobileCss;
          rootEl.shadowRoot.appendChild(style);
        }

        function checkAndInject() {
          ['fab-root', 'webchat-root'].forEach(function(id) {
            injectShadowStyle(document.getElementById(id));
          });
          var container = document.querySelector('.bpChatContainer');
          if (container && container.childNodes) {
            container.childNodes.forEach(function(node) {
              if (node && node.shadowRoot) injectShadowStyle(node);
            });
          }
        }

        function loadBotpress() {
          // P3-B: MutationObserver starts INSIDE loadBotpress — not at page load.
          // This avoids observing every React hydration DOM mutation before chatbot exists.
          var observer = new MutationObserver(checkAndInject);
          observer.observe(document.documentElement, { childList: true, subtree: true });

          var s1 = document.createElement('script');
          s1.src = "https://cdn.botpress.cloud/webchat/v5.0/inject.js";
          s1.async = true;
          s1.onerror = function() {
            // Fail gracefully if CDN is blocked or unreachable
            console.warn("Botpress webchat inject failed to load.");
            observer.disconnect();
          };
          s1.onload = function() {
            var s2 = document.createElement('script');
            s2.src = "https://files.bpcontent.cloud/2026/11/09/14/20261109140645-5QK94I08.js";
            s2.async = true;
            s2.onerror = function() {
              console.warn("Botpress config failed to load.");
              observer.disconnect();
            };
            s2.onload = function() {
              checkAndInject();
              // Adaptive interval: stops as soon as both roots are styled, max 6 attempts (3s)
              var attempts = 0;
              var interval = setInterval(function() {
                checkAndInject();
                attempts++;
                var fabRoot = document.getElementById('fab-root');
                var chatRoot = document.getElementById('webchat-root');
                var fabDone = fabRoot && fabRoot.shadowRoot && fabRoot.shadowRoot.getElementById('bp-mobile-style');
                var chatDone = chatRoot && chatRoot.shadowRoot && chatRoot.shadowRoot.getElementById('bp-mobile-style');
                if ((fabDone && chatDone) || attempts >= 6) {
                  clearInterval(interval);
                  observer.disconnect();
                }
              }, 500);
            };
            document.body.appendChild(s2);
          };
          document.body.appendChild(s1);
        }

        // P3-B: Use window.load + requestIdleCallback only.
        // Removes scroll/mousemove/touchstart/keydown interaction listeners.
        // Lighthouse desktop fires those events synthetically at ~600ms, which caused
        // Botpress to load during the TBT measurement window and worsen TBT.
        // window.load fires after the page is fully painted — Lighthouse cannot advance this.
        window.addEventListener('load', function() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadBotpress, { timeout: 8000 });
          } else {
            setTimeout(loadBotpress, 7000);
          }
        });
      })();
    </script>
